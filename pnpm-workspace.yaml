# Don't shell out to `pnpm install` before every `pnpm run <script>`.
# This machine's global pnpm config carries an unresolved allow-builds prompt
# that makes that pre-flight check exit non-zero even when deps are in sync.
verifyDepsBeforeRun: false

# Native packages that are allowed to run install scripts (compile).
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - unrs-resolver
  - '@parcel/watcher'
  - vue-demi

# This machine's global pnpm config sets a `minimumReleaseAge` gate; the
# entries below opt specific, already-vetted versions past it so installs
# are reproducible.
minimumReleaseAgeExclude:
  - '@vue/compiler-core@3.5.42'
  - '@vue/compiler-dom@3.5.42'
  - '@vue/compiler-sfc@3.5.42'
  - '@vue/compiler-ssr@3.5.42'
  - '@vue/reactivity@3.5.42'
  - '@vue/runtime-core@3.5.42'
  - '@vue/runtime-dom@3.5.42'
  - '@vue/server-renderer@3.5.42'
  - '@vue/shared@3.5.42'
  - vue@3.5.42
