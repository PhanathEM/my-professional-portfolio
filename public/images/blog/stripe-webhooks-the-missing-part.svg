<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Node.js">
  <rect width="1200" height="675" fill="#0e0e10"/>
  <text x="120" y="120" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" letter-spacing="4" fill="#ff631c">NODE.JS</text>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="26" fill="#c9c9d1" xml:space="preserve">
    <text x="120" y="200">const event = stripe.webhooks.constructEvent(</text>
<text x="120" y="246">  rawBody, sig, process.env.STRIPE_WEBHOOK_SECRET)</text>
<text x="120" y="292">if (await seen(event.id)) return 200</text>
<text x="120" y="338">await handle(event)</text>
<text x="120" y="384">await markSeen(event.id)</text>
  </g>
</svg>
