<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="PostgreSQL">
  <rect width="1200" height="675" fill="#0e0e10"/>
  <text x="120" y="120" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" letter-spacing="4" fill="#ff631c">POSTGRESQL</text>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="26" fill="#c9c9d1" xml:space="preserve">
    <text x="120" y="200">create table orders (</text>
<text x="120" y="246">  id bigint generated always as identity,</text>
<text x="120" y="292">  customer_id bigint not null references customers,</text>
<text x="120" y="338">  created_at timestamptz not null default now(),</text>
<text x="120" y="384">  deleted_at timestamptz</text>
<text x="120" y="430">);</text>
  </g>
</svg>
